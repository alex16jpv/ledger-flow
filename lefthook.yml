pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,cjs,json,css,md}"
      run: npx prettier --check {staged_files}
    lint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: npx eslint --max-warnings=0 --no-warn-ignored {staged_files}
    tokens:
      glob: "*.{ts,tsx,css}"
      run: node tools/check-tokens.mjs {staged_files}
    typecheck:
      run: npm run typecheck
    tests:
      glob: "*.{ts,tsx}"
      run: npx vitest related --run {staged_files}
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
